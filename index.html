<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MY SPACE — личная и бизнес-система управления</title>
<!-- Подключение Supabase JS v2 -->
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
@import url('https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,400;0,9..40,500;0,9..40,600;0,9..40,700;1,9..40,400&family=Manrope:wght@400;500;600;700&family=Playfair+Display:ital,wght@0,500;0,600;0,700;1,500&display=swap');

:root {
  --matcha-deep: #4E5B31;
  --matcha-mid: #5E6B3C;
  --matcha: #838F58;
  --matcha-soft: #E5EBD4;
  --espresso: #362009;
  --almond: #EFE1D5;
  --almond-card: #FAF4EE;
  --almond-pure: #FFFDFB;
  --line: #DFCFC0;
  --muted: #5F5849;
  --strawberry: #F9D1D9;
  --strawberry-soft: #FCE8EC;
  --lightblue: #B1D5E3;
  --lightblue-soft: #E5F2F7;
  --shadow: 0 14px 34px rgba(78, 91, 49, 0.08);
  --shadow-lg: 0 22px 54px rgba(58, 69, 34, 0.22);
  --radius: 20px;
}

* { box-sizing: border-box; }
html { scroll-behavior: smooth; }
body {
  margin: 0;
  background: var(--almond);
  color: var(--espresso);
  font: 14px/1.55 'Manrope', 'DM Sans', -apple-system, BlinkMacSystemFont, sans-serif;
  overflow-x: hidden;
}
button, input, select, textarea { font: inherit; }
button { cursor: pointer; }

/* Экран авторизации */
#auth-screen {
  position: fixed; inset: 0; z-index: 1000;
  background: linear-gradient(135deg, var(--matcha-deep) 0%, var(--matcha-mid) 60%, var(--espresso) 100%);
  display: flex; align-items: center; justify-content: center; padding: 20px;
}
.auth-card {
  background: var(--almond-pure);
  border-radius: 26px; padding: 36px 32px;
  width: min(440px, 100%);
  box-shadow: 0 30px 80px rgba(45, 54, 26, 0.4);
  border: 1px solid var(--line);
  text-align: center;
}
.auth-card h1 {
  font: 600 28px 'Playfair Display', Georgia, serif;
  color: var(--matcha-deep); margin: 0 0 6px; letter-spacing: 1px;
}
.auth-card p {
  color: var(--muted); font-size: 13.5px; margin-bottom: 24px;
}
.auth-error {
  background: var(--strawberry-soft); border: 1px solid #F0C3CC;
  color: #7D2835; padding: 10px 14px; border-radius: 11px;
  font-size: 12.5px; margin-bottom: 16px; display: none; text-align: left;
}

/* Синхронизация статус */
.sync-status {
  display: inline-flex; align-items: center; gap: 6px;
  font-size: 11.5px; font-weight: 600; padding: 5px 12px; border-radius: 99px;
  background: var(--almond-card); border: 1px solid var(--line); color: var(--muted);
  margin-left: 10px;
}
.sync-status.syncing { color: var(--matcha-deep); border-color: var(--matcha); }
.sync-status.saved { color: #355E3B; background: #EAF2EC; border-color: #A3C1AD; }
.sync-status.error { color: #8B0000; background: #FDE8E8; border-color: #F8B4B4; }

.app {
  display: grid;
  grid-template-columns: 278px minmax(0, 1fr);
  min-height: 100vh;
}

.sidebar {
  height: 100vh;
  position: sticky;
  top: 0;
  overflow-y: auto;
  background: linear-gradient(180deg, var(--matcha-deep) 0%, var(--matcha-mid) 58%, #6D7A48 100%);
  color: var(--almond-pure);
  padding: 26px 18px 22px;
  display: flex;
  flex-direction: column;
  z-index: 20;
  box-shadow: 6px 0 30px rgba(78, 91, 49, 0.16);
}

.brand {
  padding: 4px 10px 20px;
  border-bottom: 1px solid rgba(255, 253, 251, 0.18);
}
.brand-mark { display: flex; align-items: center; justify-content: space-between; }
.brand h1 {
  font: 600 22px 'Playfair Display', Georgia, serif;
  margin: 0; letter-spacing: 1.5px; color: var(--almond-pure);
}
.brand small {
  display: block; color: var(--strawberry); font-size: 9px;
  letter-spacing: 2.3px; margin: 5px 0 0 0; font-weight: 600;
}

.nav-group { margin: 18px 0 0; }
.nav-label {
  font-size: 9.5px; letter-spacing: 1.8px; text-transform: uppercase;
  color: rgba(255, 253, 251, 0.65); padding: 0 12px 6px; font-weight: 700;
}
.nav {
  width: 100%; display: flex; align-items: center; gap: 11px;
  text-align: left; border: 0; background: transparent;
  color: var(--almond-pure); padding: 9px 13px; border-radius: 12px;
  margin: 2px 0; font-size: 13px; font-weight: 500;
  transition: all 0.18s ease;
}
.nav .ico {
  width: 20px; text-align: center; font-size: 15px;
  color: var(--strawberry); transition: 0.18s;
}
.nav:hover {
  background: rgba(249, 209, 217, 0.16);
  color: #FFFFFF;
  transform: translateX(2px);
}
.nav.active {
  background: var(--strawberry);
  color: var(--matcha-deep);
  font-weight: 700;
  box-shadow: 0 6px 18px rgba(45, 54, 26, 0.25);
}
.nav.active .ico { color: var(--matcha-deep); }

.side-bottom {
  margin-top: auto; padding: 16px 12px 0;
  border-top: 1px solid rgba(255, 253, 251, 0.18);
  color: rgba(255, 253, 251, 0.8); font-size: 11px; line-height: 1.65;
}
.logout-btn {
  background: rgba(249, 209, 217, 0.2); border: 1px solid rgba(249, 209, 217, 0.4);
  color: var(--almond-pure); width: 100%; padding: 8px; border-radius: 10px;
  font-weight: 600; font-size: 12px; margin-top: 12px; transition: 0.15s;
}
.logout-btn:hover { background: var(--strawberry); color: var(--matcha-deep); }

main {
  min-width: 0;
  padding: 26px clamp(18px, 3.5vw, 52px) 64px;
  max-width: 1540px; width: 100%; margin: 0 auto;
}

.mobilebar {
  display: none; align-items: center; justify-content: space-between;
  margin-bottom: 18px;
}
.menu-btn {
  border: 1px solid var(--line); background: var(--almond-pure);
  border-radius: 11px; padding: 9px 14px; color: var(--matcha-deep);
  font-weight: 700; box-shadow: var(--shadow);
}

.topline {
  display: flex; justify-content: space-between; align-items: center;
  margin-bottom: 22px; gap: 12px; flex-wrap: wrap;
}
.crumb {
  font-size: 10.5px; text-transform: uppercase; letter-spacing: 2px;
  color: var(--matcha-deep); font-weight: 700;
  background: var(--strawberry); padding: 6px 14px; border-radius: 99px;
}
.topline-right { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.today-pill {
  border: 1px solid var(--line); background: var(--almond-pure);
  padding: 8px 16px; border-radius: 99px; color: var(--matcha-deep);
  font-size: 12px; font-weight: 600;
}

h1, h2, h3, p { margin-top: 0; }
.page-heading {
  font: 600 clamp(28px, 3vw, 38px)/1.18 'Playfair Display', Georgia, serif;
  margin: 6px 0 8px; color: var(--matcha-deep);
}
.page-desc {
  color: var(--muted); font-size: 14px; margin: 0 0 24px; max-width: 740px;
}

.hero {
  position: relative; overflow: hidden;
  border-radius: 26px;
  background: linear-gradient(125deg, var(--matcha-deep) 0%, var(--matcha-mid) 54%, var(--matcha) 100%);
  color: var(--almond-pure);
  padding: 34px 38px;
  display: grid;
  grid-template-columns: 1.2fr 0.8fr;
  gap: 28px;
  align-items: center;
  box-shadow: var(--shadow-lg);
  margin-bottom: 22px;
}
.hero::before {
  content: ""; position: absolute;
  width: 340px; height: 340px; border-radius: 50%;
  background: radial-gradient(circle, rgba(249, 209, 217, 0.24) 0%, transparent 70%);
  right: -60px; top: -90px; pointer-events: none;
}
.hero-copy { position: relative; z-index: 2; }
.hero-kicker {
  display: inline-block; font-size: 10px; letter-spacing: 2.2px;
  text-transform: uppercase; color: var(--strawberry); font-weight: 700;
  background: rgba(54, 32, 9, 0.26);
  border: 1px solid rgba(249, 209, 217, 0.45);
  padding: 5px 13px; border-radius: 99px;
}
.hero h2 {
  font: 600 clamp(28px, 3.2vw, 42px)/1.15 'Playfair Display', Georgia, serif;
  margin: 14px 0 12px; color: var(--almond-pure);
}
.hero p {
  font-size: 14px; line-height: 1.7; color: rgba(255, 253, 251, 0.92);
  max-width: 540px; margin-bottom: 22px;
}

.hero-panel {
  position: relative; z-index: 2;
  background: rgba(255, 253, 251, 0.14);
  backdrop-filter: blur(12px);
  border: 1px solid rgba(249, 209, 217, 0.36);
  border-radius: 20px;
  padding: 20px 22px;
}
.hero-panel-label {
  font-size: 10px; text-transform: uppercase; letter-spacing: 1.8px;
  color: var(--strawberry); font-weight: 700; margin-bottom: 8px;
}
.hero-panel-title {
  font: 500 18px/1.35 'Playfair Display', Georgia, serif;
  color: var(--almond-pure); margin-bottom: 14px;
}
.hero-mini-stats {
  display: grid; grid-template-columns: 1fr 1fr; gap: 10px;
}
.hero-mini-box {
  background: rgba(52, 62, 31, 0.55);
  border: 1px solid rgba(255, 253, 251, 0.2);
  border-radius: 13px; padding: 10px 12px;
}
.hero-mini-box b { display: block; font-size: 18px; color: var(--lightblue); }
.hero-mini-box.matcha-box b { color: var(--strawberry); }
.hero-mini-box span { font-size: 11px; color: var(--almond-pure); opacity: 0.9; }

.hero-quick-habits {
  margin-top: 12px; padding-top: 12px;
  border-top: 1px solid rgba(255, 253, 251, 0.2);
  display: flex; flex-wrap: wrap; gap: 6px;
}
.hero-habit-chip {
  border: 1px solid rgba(249, 209, 217, 0.45);
  background: rgba(52, 62, 31, 0.35);
  color: var(--almond-pure);
  font-size: 11px; font-weight: 600;
  padding: 5px 10px; border-radius: 99px;
  transition: 0.15s;
}
.hero-habit-chip:hover { background: rgba(249, 209, 217, 0.25); }
.hero-habit-chip.done {
  background: var(--strawberry);
  border-color: var(--strawberry);
  color: var(--matcha-deep);
}

.btn {
  border: 0; background: var(--matcha-deep); color: var(--almond-pure);
  padding: 11px 18px; border-radius: 12px; font-size: 13px; font-weight: 600;
  transition: all 0.18s ease; box-shadow: 0 6px 16px rgba(78, 91, 49, 0.22);
  display: inline-flex; align-items: center; gap: 7px;
}
.btn:hover { background: var(--matcha-mid); transform: translateY(-1px); }
.btn-strawberry { background: var(--strawberry); color: var(--matcha-deep); font-weight: 700; }
.btn-strawberry:hover { background: #F5BFC9; }
.btn-matcha { background: var(--matcha); color: #FFFFFF; }
.btn-matcha:hover { background: var(--matcha-deep); }
.btn-lightblue { background: var(--lightblue); color: var(--matcha-deep); font-weight: 700; }
.btn-light { background: var(--strawberry-soft); color: var(--matcha-deep); border: 1px solid #F0C3CC; box-shadow: none; }
.btn-light:hover { background: var(--strawberry); }
.btn-outline { background: rgba(255, 253, 251, 0.14); border: 1px solid rgba(255, 253, 251, 0.55); color: var(--almond-pure); box-shadow: none; }
.btn-sm { padding: 8px 13px; font-size: 12px; border-radius: 10px; }
.actions { display: flex; gap: 10px; flex-wrap: wrap; }

.grid { display: grid; gap: 16px; }
.stats { grid-template-columns: repeat(4, minmax(0, 1fr)); margin: 0 0 20px; }
.stat-card {
  background: var(--almond-pure); border: 1px solid var(--line);
  border-radius: 18px; padding: 18px 20px; box-shadow: var(--shadow);
  position: relative; overflow: hidden; transition: transform 0.18s ease;
}
.stat-card:hover { transform: translateY(-2px); }
.stat-card::before { content: ""; position: absolute; left: 0; top: 0; bottom: 0; width: 6px; background: var(--matcha); }
.stat-card.accent-strawberry::before { background: var(--strawberry); }
.stat-card.accent-lightblue::before { background: var(--lightblue); }
.stat-card.accent-coffee::before { background: var(--matcha-deep); }
.stat-card.accent-espresso::before { background: var(--espresso); }

.stat-label { font-size: 11px; color: var(--muted); font-weight: 700; text-transform: uppercase; letter-spacing: 0.6px; }
.stat-value { font: 600 28px/1.15 'Playfair Display', Georgia, serif; color: var(--matcha-deep); margin: 8px 0 4px; }
.stat-note { font-size: 11.5px; color: var(--muted); }

.columns { grid-template-columns: 1.25fr 0.75fr; align-items: start; }
.card {
  background: var(--almond-pure); border: 1px solid var(--line);
  border-radius: var(--radius); padding: 22px; box-shadow: var(--shadow); min-width: 0;
}
.card-head { display: flex; justify-content: space-between; align-items: center; gap: 10px; margin-bottom: 16px; flex-wrap: wrap; }
.card-head h3 { font: 600 20px 'Playfair Display', Georgia, serif; color: var(--matcha-deep); margin: 0; }
.subtle-link {
  border: 0; background: var(--strawberry); color: var(--matcha-deep);
  font-size: 12px; font-weight: 700; padding: 6px 13px; border-radius: 99px; transition: 0.15s;
}
.subtle-link:hover { background: #F4BCC7; }

.task {
  display: flex; gap: 13px; align-items: flex-start; padding: 14px 16px; margin-bottom: 10px;
  background: var(--almond-card); border: 1px solid var(--line); border-left: 5px solid var(--matcha);
  border-radius: 14px; transition: all 0.16s ease;
}
.task:last-child { margin-bottom: 0; }
.task:hover { background: #FFFFFF; border-color: #C3B89E; box-shadow: 0 6px 18px rgba(78, 91, 49, 0.08); }
.task.prio-high { border-left-color: var(--espresso); }
.task.prio-low { border-left-color: var(--lightblue); }
.task.done { opacity: 0.72; background: #F1EBE2; border-left-color: var(--matcha); }

.check {
  appearance: none; -webkit-appearance: none; width: 21px; height: 21px; flex: none;
  border: 2px solid var(--matcha-deep); background: #FFFFFF; border-radius: 6px; margin: 1px 0 0; cursor: pointer;
}
.check:checked { background: var(--matcha-deep); border-color: var(--matcha-deep); }
.check:checked::after { content: '✓'; display: block; color: #FFFFFF; font-size: 13px; font-weight: 700; text-align: center; line-height: 17px; }

.task-info { flex: 1; min-width: 0; }
.task-name { font-size: 15px; color: var(--espresso); font-weight: 700; line-height: 1.4; overflow-wrap: anywhere; }
.task.done .task-name { text-decoration: line-through; color: var(--muted); }
.task-note-preview { font-size: 13px; color: var(--muted); margin-top: 4px; white-space: pre-wrap; }
.note-body-text { white-space: pre-wrap; line-height: 1.7; overflow-wrap: anywhere; }
.task-meta { display: flex; flex-wrap: wrap; align-items: center; gap: 7px; font-size: 11.5px; color: var(--muted); margin-top: 8px; }

.tag {
  display: inline-flex; align-items: center; gap: 4px; padding: 4px 10px; border-radius: 99px;
  background: var(--matcha-soft); color: var(--matcha-deep); font-size: 11px; font-weight: 700; white-space: nowrap;
}
.tag.strawberry { background: var(--strawberry); color: var(--matcha-deep); }
.tag.lightblue { background: var(--lightblue); color: var(--espresso); }
.tag.coffee { background: var(--matcha-deep); color: var(--almond-pure); }
.tag.espresso { background: var(--espresso); color: var(--almond); }

.business-tile {
  display: flex; align-items: center; gap: 14px; padding: 14px 12px; border-radius: 14px;
  border-bottom: 1px solid var(--line); transition: 0.15s;
}
.business-tile:hover { background: var(--almond-card); }
.business-tile:last-child { border-bottom: 0; }
.biz-icon { width: 44px; height: 44px; border-radius: 14px; display: grid; place-items: center; font-size: 20px; flex: none; font-weight: 700; }
.business-tile:nth-child(1) .biz-icon { background: var(--matcha-deep); color: #FFFFFF; }
.business-tile:nth-child(2) .biz-icon { background: var(--espresso); color: var(--almond); }
.business-tile:nth-child(3) .biz-icon { background: var(--lightblue); color: var(--espresso); }
.business-tile:nth-child(4) .biz-icon { background: var(--strawberry); color: var(--matcha-deep); }
.biz-name { font: 600 16px 'Playfair Display', Georgia, serif; color: var(--matcha-deep); }
.biz-desc { font-size: 12px; color: var(--muted); margin-top: 2px; }

.progress { height: 10px; border-radius: 99px; background: #E3D7C8; overflow: hidden; }
.progress span { display: block; height: 100%; background: linear-gradient(90deg, var(--matcha-deep), var(--matcha), var(--strawberry)); border-radius: 99px; transition: width 0.3s ease; }

.toolbar { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; margin-bottom: 18px; }
.field {
  width: 100%; border: 1.5px solid #D2C3B2; background: var(--almond-pure); border-radius: 11px;
  padding: 10px 13px; color: var(--espresso); outline: none; font-size: 13.5px; font-weight: 500;
}
.field::placeholder { color: #877C6C; font-weight: 400; }
.field:focus { border-color: var(--matcha-deep); box-shadow: 0 0 0 3px rgba(131, 143, 88, 0.25); }
.field-label { display: block; font-size: 11.5px; color: var(--matcha-deep); margin: 0 0 6px; font-weight: 700; }
.form-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
.form-grid .full { grid-column: 1 / -1; }
.filter { max-width: 220px; }

.list-row { display: flex; align-items: center; gap: 13px; padding: 14px 16px; margin-bottom: 10px; background: var(--almond-card); border: 1px solid var(--line); border-radius: 14px; }
.list-row:last-child { margin-bottom: 0; }
.list-row-main { flex: 1; min-width: 0; }
.list-row-title { font-size: 14.5px; font-weight: 700; color: var(--espresso); }
.list-row-meta { font-size: 12px; color: var(--muted); margin-top: 4px; line-height: 1.5; }
.delete {
  border: 1px solid var(--line); background: var(--strawberry-soft); color: var(--matcha-deep);
  width: 30px; height: 30px; border-radius: 9px; font-size: 17px; display: grid; place-items: center; flex: none; transition: 0.15s;
}
.delete:hover { background: var(--strawberry); color: var(--matcha-deep); border-color: #E8B4BF; }

.empty { padding: 34px 18px; text-align: center; color: var(--muted); font-size: 13.5px; background: var(--almond-card); border-radius: 14px; border: 1px dashed #C8B9A6; }
.notice { background: var(--lightblue-soft); border: 1px solid var(--lightblue); border-radius: 15px; padding: 15px 18px; color: var(--espresso); font-size: 12.5px; line-height: 1.65; margin-top: 16px; }

.habit-concept-wrap {
  background: linear-gradient(135deg, var(--matcha-soft) 0%, var(--almond-pure) 52%, var(--strawberry-soft) 100%);
  border: 1px solid var(--line); border-radius: 18px; padding: 18px 20px; margin-bottom: 20px;
}
.habit-concept-head { display: flex; justify-content: space-between; align-items: center; gap: 10px; }
.habit-concept-grid { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 14px; margin-top: 14px; }
.habit-step { background: var(--almond-pure); border-radius: 14px; padding: 14px 16px; border: 1px solid var(--line); }
.habit-step b { display: block; color: var(--matcha-deep); font-size: 13px; margin-bottom: 4px; }
.habit-step span { font-size: 12px; color: var(--muted); line-height: 1.5; }

.habit-card {
  background: var(--almond-pure); border: 1px solid var(--line); border-radius: 18px;
  padding: 18px 20px; margin-bottom: 14px; box-shadow: var(--shadow); display: grid; grid-template-columns: 1fr auto; gap: 16px; align-items: center;
}
.habit-days { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 12px; }
.day-dot {
  width: 42px; height: 48px; border-radius: 50%; border: 1.5px solid #C8BCA8; background: var(--almond-card);
  display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 1px; font-size: 10px; font-weight: 700; color: var(--muted); transition: 0.16s;
}
.day-dot.today { border-color: var(--matcha-deep); border-width: 2px; }
.day-dot.checked { background: var(--matcha-deep); border-color: var(--matcha-deep); color: #FFFFFF; box-shadow: 0 4px 12px rgba(78, 91, 49, 0.3); }
.day-dot i { font-style: normal; font-size: 13px; }

.tabs { display: inline-flex; flex-wrap: wrap; gap: 6px; background: #DFD2C3; padding: 5px; border-radius: 14px; }
.tab-btn { border: 0; background: transparent; color: var(--espresso); padding: 8px 14px; border-radius: 10px; font-size: 12.5px; font-weight: 600; transition: 0.15s; }
.tab-btn.active { background: var(--matcha-deep); color: var(--almond-pure); box-shadow: 0 3px 10px rgba(78, 91, 49, 0.22); }

.crm-card {
  background: var(--almond-card); border: 1px solid var(--line); border-left: 5px solid var(--lightblue);
  border-radius: 16px; padding: 16px 18px; margin-bottom: 12px; display: flex; flex-wrap: wrap; gap: 14px; align-items: center; justify-content: space-between;
}
.crm-status-select { border: 1.5px solid #D2C3B2; background: var(--almond-pure); border-radius: 10px; padding: 6px 10px; font-size: 12px; font-weight: 700; color: var(--matcha-deep); }

.modal-back {
  position: fixed; inset: 0; background: rgba(45, 54, 26, 0.55); backdrop-filter: blur(4px);
  display: none; align-items: center; justify-content: center; padding: 18px; z-index: 50;
}
.modal-back.show { display: flex; }
.modal {
  background: var(--almond-pure); border: 1px solid var(--line); width: min(580px, 100%);
  max-height: 90vh; overflow-y: auto; border-radius: 24px; padding: 26px; box-shadow: 0 28px 90px rgba(45, 54, 26, 0.32);
}

<script>
// Настройки Supabase (только публичные ключи)
const SUPABASE_URL = 'https://dhmemutjurytheffxezi.supabase.co';
const SUPABASE_PUBLISHABLE_KEY = 'sb_publishable_mH74XH2dKeJ0ct4hCVwzjw_0CrET6Xn';

const supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_PUBLISHABLE_KEY);

let currentUser = null;
let saveTimeout = null;

const $ = s => document.querySelector(s);
const $$ = s => [...document.querySelectorAll(s)];

const TODAY = new Date().toLocaleDateString('en-CA');
const dateFmt = d => d ? new Date(d + 'T12:00:00').toLocaleDateString('ru-RU', { day: 'numeric', month: 'short' }) : 'Без даты';
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));

const businesses = [
  { id: 'lymi-sites', name: 'LYMI — сайты', desc: 'Свадебные и event-приглашения, шаблоны и индивидуальные сайты', icon: '✧', tagClass: '' },
  { id: 'lymi-print', name: 'LYMI — типография', desc: 'Печатная продукция, фотокниги, полиграфия и заказы', icon: '❋', tagClass: 'espresso' },
  { id: 'lymi-global', name: 'LYMI — международный рынок', desc: 'Англоязычный рынок, международные клиенты и продвижение', icon: '✦', tagClass: 'lightblue' },
  { id: 'blog', name: 'Личный блог', desc: 'Контент, идеи, публикации и развитие личного бренда', icon: '☼', tagClass: 'strawberry' }
];

const CRM_STATUSES = [
  { label: 'Новый лид', cls: 'lightblue' },
  { label: 'В переговорах', cls: 'strawberry' },
  { label: 'В работе', cls: '' },
  { label: 'Оплачен / Завершён', cls: 'coffee' }
];

const CURRENCY_META = {
  USD: { symbol: '$', name: 'Доллары (USD)', decimals: 2 },
  RUB: { symbol: '₽', name: 'Рубли (RUB)', decimals: 0 },
  VND: { symbol: '₫', name: 'Донги (VND)', decimals: 0 }
};

const defaultDB = {
  tasks: [],
  notes: [],
  finance: [],
  goals: [],
  habits: [],
  clients: [],
  projects: [],
  reflections: [],
  settings: {
    displayCurrency: 'USD',
    habitGuideOpen: true,
    ratesToUSD: { USD: 1, RUB: 92, VND: 25400 }
  }
};

let db = JSON.parse(JSON.stringify(defaultDB));

// Авторизация
async function checkAuth() {
  const { data: { session } } = await supabaseClient.auth.getSession();
  if (session && session.user) {
    currentUser = session.user;
    $('#auth-screen').style.display = 'none';
    await loadUserData();
  } else {
    $('#auth-screen').style.display = 'flex';
  }
}

async function handleLogin(e) {
  e.preventDefault();
  const email = $('#auth-email').value.trim();
  const password = $('#auth-password').value;
  const errBox = $('#auth-error');
  errBox.style.display = 'none';

  const { data, error } = await supabaseClient.auth.signInWithPassword({ email, password });
  if (error) {
    errBox.textContent = 'Ошибка входа: ' + error.message;
    errBox.style.display = 'block';
  } else if (data.session) {
    currentUser = data.session.user;
    $('#auth-screen').style.display = 'none';
    await loadUserData();
  }
}

async function handleLogout() {
  await supabaseClient.auth.signOut();
  currentUser = null;
  $('#auth-screen').style.display = 'flex';
}

// Загрузка и сохранение данных с Supabase
async function loadUserData() {
  updateSyncStatus('syncing', '🔄 Загрузка...');
  try {
    const { data, error } = await supabaseClient
      .from('workspace_data')
      .select('data')
      .eq('user_id', currentUser.id)
      .single();

    if (error && error.code !== 'PGRST116') {
      console.error('Ошибка загрузки из Supabase:', error);
    }

    if (data && data.data && Object.keys(data.data).length > 0) {
      // Данные в облаке есть — используем их
      db = mergeDB(defaultDB, data.data);
    } else {
      // В облаке данных нет. Проверим локальные данные (миграция при первом входе)
      const rawStr = localStorage.getItem('myspace_v2') || localStorage.getItem('myspace_v3') || '{}';
      let localParsed = {};
      try { localParsed = JSON.parse(rawStr); } catch(err){}
      
      if (Object.keys(localParsed).length > 0) {
        db = mergeDB(defaultDB, localParsed);
      } else {
        db = JSON.parse(JSON.stringify(defaultDB));
      }
      // Сразу сохраняем текущие данные в облако
      await saveToCloudImmediate();
    }
    updateSyncStatus('saved', '✓ Сохранено в облаке');
    render();
  } catch (err) {
    console.error(err);
    updateSyncStatus('error', '⚠️ Ошибка сети');
  }
}

function mergeDB(def, raw) {
  const merged = {
    ...def,
    ...raw,
    settings: {
      ...def.settings,
      ...(raw.settings || {}),
      ratesToUSD: {
        ...def.settings.ratesToUSD,
        ...((raw.settings && raw.settings.ratesToUSD) || {})
      }
    }
  };
  if (Array.isArray(raw.crm) && !merged.clients.length) {
    merged.clients = raw.crm;
  }
  merged.habits = (merged.habits || []).map(h => ({
    ...h,
    logs: Array.isArray(h.logs) ? h.logs : (h.done ? [TODAY] : []),
    category: h.category || 'Баланс',
    frequency: h.frequency || h.extra || 'Каждый день'
  }));
  merged.finance = (merged.finance || []).map(f => ({
    ...f,
    currency: f.currency || 'USD',
    scope: f.scope || (f.biz === 'Личное' ? 'personal' : 'business')
  }));
  return merged;
}

function save() {
  // Локальный кэш
  localStorage.setItem('myspace_v2', JSON.stringify(db));
  
  // Автоматическая отправка в облако с дебаунсом (защита от частых запросов)
  updateSyncStatus('syncing', '🔄 Синхронизация...');
  if (saveTimeout) clearTimeout(saveTimeout);
  saveTimeout = setTimeout(async () => {
    await saveToCloudImmediate();
  }, 1000);
}

async function saveToCloudImmediate() {
  if (!currentUser) return;
  try {
    const { error } = await supabaseClient
      .from('workspace_data')
      .upsert({
        user_id: currentUser.id,
        data: db,
        updated_at: new Date().toISOString()
      });

    if (error) {
      console.error('Ошибка сохранения в Supabase:', error);
      updateSyncStatus('error', '⚠️ Ошибка сохранения');
    } else {
      updateSyncStatus('saved', '✓ Сохранено в облаке');
    }
  } catch(err) {
    console.error(err);
    updateSyncStatus('error', '⚠️ Нет интернета');
  }
}

function updateSyncStatus(statusClass, text) {
  const el = $('#syncStatus');
  if (!el) return;
  el.className = 'sync-status ' + statusClass;
  el.textContent = text;
}

// Валютные функции
function convertMoney(amount, fromCur, toCur) {
  const rates = db.settings.ratesToUSD;
  const fromRate = Number(rates[fromCur]) || 1;
  const toRate = Number(rates[toCur]) || 1;
  const inUSD = Number(amount) / fromRate;
  return inUSD * toRate;
}

function formatMoney(amount, cur) {
  const meta = CURRENCY_META[cur] || CURRENCY_META.USD;
  const num = Number(amount) || 0;
  const formatted = num.toLocaleString('ru-RU', {
    minimumFractionDigits: meta.decimals,
    maximumFractionDigits: meta.decimals
  });
  return `${formatted} ${meta.symbol}`;
}

let page = 'home';
let financeScopeTab = 'all';
let financeBizFilter = '';
let crmBizFilter = '';
let crmStatusFilter = '';

function taskRows(arr) {

  return `
    <div class="form-grid">
      <div class="full"><label class="field-label">Название задачи</label>

      </select></div>

}
function addTask(biz) {

  setTimeout(() => $('#f-name')?.focus(), 50);
}
function editTask(id) {
  const existing = db.tasks.find(t => t.id === Number(id));
  if (!existing) return;
  openModal('Редактировать задачу', taskForm(existing.biz, existing));
  $('#saveTask').dataset.editId = existing.id;
}
function saveTask() {
  const name = $('#f-name').value.trim();
  if (!name) { $('#f-name').focus(); return; }
  const editId = $('#saveTask').dataset.editId;
  const old = editId ? db.tasks.find(t => t.id === Number(editId)) : null;
  const payload = { ...(old || {}), id: old ? old.id : Date.now(), name,
    biz: $('#f-biz').value, priority: $('#f-priority').value, date: $('#f-date').value,
    note: $('#f-note').value, done: old ? old.done : false, status: $('#f-status').value };
  if (old) db.tasks = db.tasks.map(t => t.id === old.id ? payload : t);
  else db.tasks.unshift(payload);
  save(); closeModal(); render();
}

function getLast7Days() {
  const days = [];
  const dayNames = ['Вс', 'Пн', 'Вт', 'Ср', 'Чт', 'Пт', 'Сб'];
  for (let i = 6; i >= 0; i--) {
    const d = new Date();
    d.setDate(d.getDate() - i);
    const iso = d.toLocaleDateString('en-CA');
    days.push({
      iso,
      short: dayNames[d.getDay()],
      num: d.getDate(),
      isToday: iso === TODAY
    });
  }
  return days;
}

function calcStreak(logs) {
  if (!logs || !logs.length) return 0;
  const set = new Set(logs);
  let streak = 0;
  const cursor = new Date();
  if (!set.has(cursor.toLocaleDateString('en-CA'))) {
    cursor.setDate(cursor.getDate() - 1);
  }
  while (set.has(cursor.toLocaleDateString('en-CA'))) {
    streak++;
    cursor.setDate(cursor.getDate() - 1);
  }
  return streak;
}

// Обработчики интерфейса
document.addEventListener('click', e => {
  const nav = e.target.closest('[data-page]');
  if (nav) { go(nav.dataset.page); return; }

  const goBtn = e.target.closest('[data-go]');
  if (goBtn) { go(goBtn.dataset.go); return; }

  const action = e.target.closest('[data-action]');
  if (action) {
    const a = action.dataset.action;
    if (a === 'add-task') addTask();
    else if (a === 'business-task') addTask(action.dataset.biz);
    else if (a === 'add-note') addNote();
    else if (a === 'add-reflection') addReflection();
    else if (a === 'add-finance') addFinance();
    else if (a === 'edit-rates') openRatesModal();
    else if (a === 'add-habit') addHabitModal();
    else if (a === 'toggle-habit-guide') {
      db.settings.habitGuideOpen = db.settings.habitGuideOpen === false;
      save();
      render();
    }
    else if (a === 'add-crm') addClientModal();
    else if (a === 'add-goals' || a === 'add-projects') addGoalOrProject(a.slice(4));
    return;
  }

  const habitToggle = e.target.closest('[data-toggle-habit]');
  if (habitToggle) {
    const [idStr, iso] = habitToggle.dataset.toggleHabit.split(':');
    const h = db.habits.find(x => x.id === Number(idStr));
    if (h) {
      h.logs = Array.isArray(h.logs) ? h.logs : [];
      if (h.logs.includes(iso)) h.logs = h.logs.filter(d => d !== iso);
      else h.logs.push(iso);
      save();
      render();
    }
    return;
  }

  const editTaskBtn = e.target.closest('[data-edit-task]');
  if (editTaskBtn) { editTask(editTaskBtn.dataset.editTask); return; }
  const editNoteBtn = e.target.closest('[data-edit-note]');
  if (editNoteBtn) { editNote(editNoteBtn.dataset.editNote); return; }
  const contentAdd = e.target.closest('[data-content-add]');
  if (contentAdd) { contentItemModal(selectedContentChannel, contentAdd.dataset.contentAdd); return; }
  const contentEdit = e.target.closest('[data-content-edit]');
  if (contentEdit) { const item = db.contentItems.find(x => x.id === Number(contentEdit.dataset.contentEdit)); if (item) contentItemModal(item.channel, item.type, item); return; }
  const restore = e.target.closest('[data-restore]');
  if (restore) {
    const entry = db.trash.find(x => String(x.trashId) === restore.dataset.restore);
    if (entry) { db[entry.collection] = db[entry.collection] || []; db[entry.collection].push(entry.item);
      db.trash = db.trash.filter(x => String(x.trashId) !== restore.dataset.restore); save(); render(); }
    return;
  }
  const permanent = e.target.closest('[data-trash-permanent]');
  if (permanent) { db.trash = db.trash.filter(x => String(x.trashId) !== permanent.dataset.trashPermanent); save(); render(); return; }

  const editCrm = e.target.closest('[data-edit-crm]');
  if (editCrm) {
    addClientModal(Number(editCrm.dataset.editCrm));
    return;
  }

  const finTab = e.target.closest('[data-fin-tab]');
  if (finTab) {
    financeScopeTab = finTab.dataset.finTab;
    render();
    return;
  }

  const dispCurBtn = e.target.closest('[data-disp-cur]');
  if (dispCurBtn) {
    db.settings.displayCurrency = dispCurBtn.dataset.dispCur;
    save();
    render();
    return;
  }

  const del = e.target.closest('[data-delete]');
  if (del) {
    const k = del.dataset.delete;
    const id = Number(del.dataset.id);
    const removed = (db[k] || []).find(x => x.id === id);
    if (removed) {
      db.trash = db.trash || [];
      db.trash.push({ trashId: `${Date.now()}-${Math.random().toString(36).slice(2,7)}`, collection: k, item: removed, deletedAt: new Date().toISOString() });
      db[k] = db[k].filter(x => x.id !== id);
    }
    save(); render();
    return;
  }

  if (e.target.id === 'saveTask') {
    saveTask();
  }
});

document.addEventListener('change', e => {
  if (e.target.matches('[data-content-toggle]')) {
    const item = db.contentItems.find(x => x.id === Number(e.target.dataset.contentToggle));
    if (item) item.done = e.target.checked;
    save(); render(); return;
  }
  if (e.target.id === 'content-channel') { selectedContentChannel = e.target.value; render(); return; }

  if (e.target.matches('[data-toggle-task]')) {
    const t = db.tasks.find(x => x.id === Number(e.target.dataset.toggleTask));
    if (t) t.done = e.target.checked;
    save();
    render();
    return;
  }

  if (e.target.matches('[data-toggle-gp]')) {
    const [kind, idStr] = e.target.dataset.toggleGp.split(':');
    const item = (db[kind] || []).find(x => x.id === Number(idStr));
    if (item) item.done = e.target.checked;
    save();
    render();
    return;
  }

  if (e.target.matches('[data-crm-status]')) {
    const c = db.clients.find(x => x.id === Number(e.target.dataset.crmStatus));
    if (c) {
      c.status = e.target.value;
      save();
      render();
    }
    return;
  }

  if (e.target.id === 'crm-biz-filter') {
    crmBizFilter = e.target.value;
    render();
    return;
  }
  if (e.target.id === 'crm-status-filter') {
    crmStatusFilter = e.target.value;
    render();
    return;
  }
  if (e.target.id === 'fin-biz-filter') {
    financeBizFilter = e.target.value;
    render();
    return;
  }
});

$('#menuBtn').addEventListener('click', () => {
  $('#sidebar').classList.add('open');
  $('#overlay').classList.add('show');
});
$('#overlay').addEventListener('click', () => {
  $('#sidebar').classList.remove('open');
  $('#overlay').classList.remove('show');
});
$('#closeModal').addEventListener('click', closeModal);
$('#modal').addEventListener('click', e => {
  if (e.target.id === 'modal') closeModal();
});

$('#today').textContent = new Date().toLocaleDateString('ru-RU', {
  weekday: 'long', day: 'numeric', month: 'long', year: 'numeric'
});

// Инициализация при загрузке страницы
checkAuth();
</script>
</body>
</html>
